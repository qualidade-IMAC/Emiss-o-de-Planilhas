<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Emissão de Planilhas IMAC - Dinâmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }
            body {
                background-color: white;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .page-break {
                page-break-after: always;
            }
            .sheet-container {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: 100% !important;
                max-width: none !important;
                border: none !important;
                transform: none !important;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.75rem;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 2px;
        }
        .rotated-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
        }
        .header-table th, .header-table td {
            border: 1px solid black;
            padding: 4px;
            font-size: 0.8rem;
        }
        
        /* Ajustes cruciais para impressão no novo layout de Dashboard */
        @media print {
            html, body, .dashboard-wrapper, .dashboard-main, main, #sheets-container {
                height: auto !important;
                overflow: visible !important;
                display: block !important;
                background-color: white !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }
        }

        @media screen {
            .sheet-container {
                width: 297mm;
                min-height: 210mm;
                position: relative;
            }
            .action-btns {
                position: absolute;
                top: 10px;
                right: 10px;
                z-index: 20;
                display: flex;
                gap: 8px;
            }
        }
        /* Hidden on print */
        @media print {
            .action-btns { display: none; }
            #editModal { display: none !important; }
        }
        
        /* Oculta a barra de rolagem horizontal nativa para as abas de setores */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#F9F9FB] font-sans text-gray-800 overflow-hidden h-screen dashboard-wrapper flex">

    <!-- SIDEBAR LATERAL FIXA -->
    <aside id="sidebar" class="w-64 bg-[#5C3A21] flex-shrink-0 flex flex-col no-print text-white shadow-xl z-20 transition-all duration-300">
        <div class="p-6 flex items-center justify-center border-b border-[#6E482D] bg-[#54341e] h-20 overflow-hidden">
            <img id="logo-img" src="logo.png" onerror="this.src='https://placehold.co/200x80/54341e/ffffff?text=IMAC'" alt="IMAC Logo" class="h-14 object-contain transition-all duration-300">
        </div>
        <nav class="flex-1 px-4 py-8 space-y-3 overflow-hidden">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-[#F2B922] text-[#5C3A21] rounded-xl font-bold shadow-md transition-transform hover:scale-105 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                <span class="sidebar-text transition-opacity duration-300">Gerador de Planilhas</span>
            </a>
        </nav>
        <div class="p-4 border-t border-[#6E482D] flex justify-center items-center">
            <button onclick="toggleSidebar()" class="flex items-center gap-2 text-[#E0C6B3] hover:text-white transition-colors text-sm font-medium w-full overflow-hidden">
                <svg id="arrow-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg> 
                <span class="sidebar-text transition-opacity duration-300 whitespace-nowrap">Recolher Menu</span>
            </button>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <div class="flex-1 flex flex-col overflow-hidden dashboard-main relative">
        
        <!-- CABEÇALHO SUPERIOR -->
        <header class="bg-white px-8 py-5 shadow-sm border-b border-gray-100 flex justify-between items-center no-print z-10 sticky top-0">
            <h1 class="text-2xl font-extrabold text-[#5C3A21] flex items-center">
                Visão Geral do Sistema 
                <span class="text-gray-400 font-semibold text-lg ml-3 pl-3 border-l-2 border-gray-200">Emissão de Planilhas</span>
            </h1>
            
            <div class="flex items-center gap-4">
                <div class="text-right hidden md:block">
                    <div class="text-[13px] font-extrabold text-[#5C3A21] uppercase tracking-wide">Equipe Qualidade</div>
                    <div class="text-xs text-gray-500 font-medium">IMAC Alimentos</div>
                </div>
                <div class="w-11 h-11 rounded-full bg-[#F2B922] flex items-center justify-center text-[#5C3A21] font-bold text-lg shadow-sm border-2 border-white ring-2 ring-gray-100">
                    EQ
                </div>
            </div>
        </header>

        <!-- ÁREA COM SCROLL PARA AS PLANILHAS -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-8">
            
            <!-- CARTÃO DE CONTROLES (Novo Design) -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8 no-print">
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                    
                    <!-- Col 1: Configuração de Datas -->
                    <div>
                        <h3 class="text-[#5C3A21] font-bold text-base mb-4 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[#F2B922]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                            Data Base das Planilhas
                        </h3>
                        <div class="flex gap-3">
                            <div class="flex flex-col flex-1">
                                <label for="monthSelect" class="text-[11px] font-bold text-gray-500 uppercase mb-1">Mês Global</label>
                                <select id="monthSelect" class="border-2 border-gray-200 rounded-xl p-2 text-sm font-semibold text-gray-700 focus:ring-0 focus:border-[#F2B922] bg-gray-50 hover:bg-white transition-colors outline-none cursor-pointer">
                                    <option value="JANEIRO">Janeiro</option>
                                    <option value="FEVEREIRO">Fevereiro</option>
                                    <option value="MARÇO">Março</option>
                                    <option value="ABRIL">Abril</option>
                                    <option value="MAIO">Maio</option>
                                    <option value="JUNHO">Junho</option>
                                    <option value="JULHO">Julho</option>
                                    <option value="AGOSTO">Agosto</option>
                                    <option value="SETEMBRO">Setembro</option>
                                    <option value="OUTUBRO">Outubro</option>
                                    <option value="NOVEMBRO">Novembro</option>
                                    <option value="DEZEMBRO">Dezembro</option>
                                </select>
                            </div>
                            <div class="flex flex-col w-24">
                                <label for="yearInput" class="text-[11px] font-bold text-gray-500 uppercase mb-1">Ano Global</label>
                                <input type="number" id="yearInput" value="2026" class="border-2 border-gray-200 rounded-xl p-2 text-sm font-semibold text-gray-700 focus:ring-0 focus:border-[#F2B922] bg-gray-50 hover:bg-white transition-colors outline-none">
                            </div>
                        </div>
                    </div>

                    <!-- Col 2: Adicionar Nova Planilha -->
                    <div class="xl:border-l xl:border-gray-200 xl:pl-8">
                        <h3 class="text-[#5C3A21] font-bold text-base mb-4 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[#F2B922]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            Adicionar Nova Planilha
                        </h3>
                        <div class="flex flex-col gap-3">
                            <select id="newSheetType" class="w-full border-2 border-gray-200 rounded-xl p-2 text-sm font-semibold text-gray-700 focus:ring-0 focus:border-[#F2B922] bg-gray-50 outline-none cursor-pointer">
                                <option value="cronograma31">Cronograma 31 Dias (ex: Equipamentos)</option>
                                <option value="pragas31">Pragas (Frente e Verso)</option>
                                <option value="temperatura2">Temperatura (2 equipamentos)</option>
                                <option value="listaVazia">Lista Vazia (Ocorrências)</option>
                            </select>
                            <div class="flex gap-2">
                                <input type="text" id="newSheetPopTitle" placeholder="Ex: POP X - NOME" class="w-full border-2 border-gray-200 rounded-xl p-2 text-sm font-semibold text-gray-700 focus:border-[#F2B922] outline-none">
                                <select id="newSheetSector" class="w-1/3 border-2 border-gray-200 rounded-xl p-2 text-sm font-semibold text-gray-700 focus:border-[#F2B922] outline-none cursor-pointer bg-white">
                                    <!-- Options serão carregadas via JS baseado na lista oficial de setores -->
                                </select>
                                <button onclick="addNewSheet()" class="bg-[#F2B922] hover:bg-[#e0a91e] text-[#5C3A21] font-extrabold px-3 rounded-xl text-lg transition-transform hover:scale-105 shadow-sm shrink-0">
                                    +
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="xl:border-l xl:border-gray-200 xl:pl-8">

                            Imprimir Planilhas
                        </h3>
                        <div class="flex flex-col gap-2">
                            <button onclick="printAllSheets()" class="w-full bg-[#5C3A21] hover:bg-[#4a2e1a] text-white font-bold py-2 px-4 rounded-xl shadow-md transition-all duration-200 flex justify-center items-center gap-2 text-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                                Imprimir TODAS Juntas
                            </button>
                            <button onclick="window.print()" class="w-full bg-white hover:bg-gray-50 text-[#5C3A21] border-2 border-[#5C3A21] font-bold py-2 px-4 rounded-xl shadow-sm transition-all duration-200 flex justify-center items-center gap-2 text-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                                Imprimir Setor Atual

            </div>

            <div id="sheets-container" class="flex flex-col items-center gap-8 pb-10">
                <!-- Rendered sheets will go here -->
            </div>
            
        </main>
    </div>

    <!-- Edit Modal Overlay -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
                    Editar Planilha
                </h2>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            
            <!-- Modal Body (Dynamic Form) -->
            <div class="p-6 overflow-y-auto flex-1">
                <input type="hidden" id="editSheetId">
                <div id="editFormContent"></div>
            </div>
            
            <!-- Modal Footer -->
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3 bg-gray-50">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold rounded shadow-sm transition-colors text-sm">
                    Cancelar
                </button>
                <button onclick="saveSheetEdit()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded shadow-sm transition-colors text-sm flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                    Salvar Alterações
                </button>
            </div>
        </div>
    </div>

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const textElements = document.querySelectorAll('.sidebar-text');
            const arrowIcon = document.getElementById('arrow-icon');
            const logo = document.getElementById('logo-img');
            
            // Verifica se a barra está expandida (usando a classe w-64)
            if (sidebar.classList.contains('w-64')) {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20'); // Recolhe para um tamanho menor
                textElements.forEach(el => el.classList.add('hidden')); // Esconde textos
                arrowIcon.style.transform = 'rotate(180deg)'; // Gira a seta
                if(logo) {
                    logo.classList.remove('h-14');
                    logo.classList.add('h-8'); // Diminui logo
                }
            } else {
                sidebar.classList.remove('w-20');
                sidebar.classList.add('w-64'); // Expande novamente
                textElements.forEach(el => el.classList.remove('hidden')); // Mostra textos
                arrowIcon.style.transform = 'rotate(0deg)'; // Volta a seta
                if(logo) {
                    logo.classList.remove('h-8');
                    logo.classList.add('h-14'); // Restaura logo
                }
            }
        }

        function printAllSheets() {
            const previousSector = activeSector;
            // Muda a visualização para Todos
            activeSector = 'Todos';
            renderSectorTabs();
            renderAllSheets();
            
            // Aguarda a renderização no DOM e depois puxa a janela de impressão
            setTimeout(() => {
                window.print();
                
                // Volta para o setor que o usuário estava vendo antes da impressão
                activeSector = previousSector;
                renderSectorTabs();
                renderAllSheets();
            }, 500); // 500ms é o suficiente para as imagens e fontes recarregarem

        function renderAllSheets() {
            const container = document.getElementById('sheets-container');
            container.innerHTML = ''; // Clear current

            const monthName = document.getElementById('monthSelect').value;
            const year = parseInt(document.getElementById('yearInput').value) || new Date().getFullYear();
            
            // Mapeia o nome do mês para um número (0 = Janeiro, 11 = Dezembro)
            const monthMap = {
                'JANEIRO': 0, 'FEVEREIRO': 1, 'MARÇO': 2, 'ABRIL': 3, 'MAIO': 4, 'JUNHO': 5,
                'JULHO': 6, 'AGOSTO': 7, 'SETEMBRO': 8, 'OUTUBRO': 9, 'NOVEMBRO': 10, 'DEZEMBRO': 11
            };
            const monthNum = monthMap[monthName] || 0;
            
            // Calcula quantos dias o mês e o ano selecionados possuem (trata anos bissextos automaticamente)
            const daysInMonth = new Date(year, monthNum + 1, 0).getDate();

            // Filtragem pelo Setor Selecionado
            const filteredSheets = activeSector === 'Todos' 
                ? sheetsConfig 
                : sheetsConfig.filter(s => s.sector === activeSector);

            if (filteredSheets.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-12 text-center w-full bg-white rounded-xl border border-gray-200 border-dashed">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                        <h3 class="text-lg font-bold text-gray-700">Nenhuma planilha neste setor</h3>
                        <p class="text-sm text-gray-500 mt-1">Adicione uma nova planilha e selecione o setor <b>${activeSector}</b>.</p>
                    </div>`;
                return;
            }

            filteredSheets.forEach((sheet) => {
                if (sheet.type === 'pragas31') {
                    // --- GERA FRENTE (Cronograma) ---
                    const frontHTML = renderPragas31(sheet, daysInMonth);
                    container.appendChild(createSheetDOM(sheet.id + '_front', frontHTML, true, sheet.id));
                    
                    // --- GERA VERSO (Lista de Ocorrências Vazia) ---
                    const backSheetConfig = {
                        ...sheet,
                        columns: ['DATA', 'PRAGA', 'LOCAL', 'ASSINATURA'],
                        rowsCount: sheet.backRowsCount || 15 // Usa a quantidade dinâmica
                    };
                    const backHTML = renderListaVazia(backSheetConfig);
                    // O botão de deletar não vai no verso (false), se deletar a frente, deleta a folha inteira
                    container.appendChild(createSheetDOM(sheet.id + '_back', backHTML, false, sheet.id));
                } else {
                    // Outras planilhas normais (1 página)
                    let contentHTML = '';
                    switch(sheet.type) {
                        case 'cronograma31': contentHTML = renderCronograma31(sheet, daysInMonth); break;
                        case 'listaVazia': contentHTML = renderListaVazia(sheet); break;
                        case 'temperatura2': contentHTML = renderTemperatura2(sheet); break;
                    }
                    container.appendChild(createSheetDOM(sheet.id, contentHTML, true, sheet.id));
                }
            });
            
            updateDates(); // Format dates after rendering
        }

        function removeSheet(id) {
            sheetsConfig = sheetsConfig.filter(s => s.id !== id);
            renderAllSheets();
        }

        function addNewSheet() {
            const type = document.getElementById('newSheetType').value;
            const popTitle = document.getElementById('newSheetPopTitle').value || 'POP X - TÍTULO DO POP';
            const sector = document.getElementById('newSheetSector').value;
            const newId = 'sheet_' + Date.now();

            let newSheet = {
                id: newId,
                type: type,
                popTitle: popTitle,
                popNumber: popTitle.split(' -')[0] || 'POP X',
                anexoInfo: 'ANEXO 1<br>'+document.getElementById('yearInput').value,
                sector: sector,
                dateFormat: 'mes_ano_espaco'
            };

            // Add default dummy data based on type
            if(type === 'cronograma31') {
                newSheet.items = [
                    { name: 'ITEM 1', freq: 'DIÁRIA' },
                    { name: 'ITEM 2', freq: 'SEMANAL' }
                ];
            } else if (type === 'pragas31') {
                newSheet.items = ['Praga 1', 'Praga 2'];
                newSheet.dateFormat = 'mes_barra_ano';
            } else if (type === 'temperatura2') {
                newSheet.tempInfo = [
                    { label: 'Temp Ideal', range: '0°C a 10°C' }
                ];
                newSheet.eq1 = 'Equipamento A - Manhã';
                newSheet.eq2 = 'Equipamento A - Tarde';
            } else if (type === 'listaVazia') {
                 newSheet.columns = ['DATA', 'DESCRIÇÃO', 'VISTO'];
                 newSheet.rowsCount = 20;
            }

            sheetsConfig.push(newSheet);
            
            // Se eu criar uma planilha para um setor que não estou visualizando, eu mudo de aba pra ver ela
            if (activeSector !== 'Todos' && activeSector !== sector) {
                selectSector(sector);
            } else {
                renderAllSheets();
            }
            
            // Limpa o título para facilitar inserir a próxima
            document.getElementById('newSheetPopTitle').value = '';
        }

        function updateDates() {
            const monthSelect = document.getElementById('monthSelect');
            const yearInput = document.getElementById('yearInput');
            
            const month = monthSelect.value;
            const year = yearInput.value;
            const monthCapitalized = month.charAt(0).toUpperCase() + month.slice(1).toLowerCase();

            const formats = {
                'mes_ano_espaco': `${month} ${year}`,
                'mes_barra_ano': `${month}/${year}`,
                'mes_capitalize_barra_ano': `${monthCapitalized} /${year}`,
                'mes_barra_espaco_ano': `${month}/ ${year}`,
                'mes_junto_ano': `${month}${year}`
            };

            const dateEls = document.querySelectorAll('.dynamic-date');
            dateEls.forEach(el => {
                const formatRequired = el.getAttribute('data-format') || 'mes_ano_espaco';
                el.textContent = formats[formatRequired] || formats['mes_ano_espaco'];
            });
        }

        function openEditModal(id) {
            const sheet = sheetsConfig.find(s => s.id === id);
            if(!sheet) return;
            
            document.getElementById('editSheetId').value = sheet.id;
            
            let html = `
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Título do POP</label>
                    <input type="text" id="editPopTitle" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none" value="${sheet.popTitle.replace(/<br>/g, ' - ')}">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Setor</label>
                    <select id="editSector" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                        ${SYSTEM_SECTORS.map(sec => `<option value="${sec}" ${sheet.sector === sec ? 'selected' : ''}>${sec}</option>`).join('')}
                    </select>
                </div>
            `;
            
            if(sheet.type === 'pragas31') {
                let currentBackRows = sheet.backRowsCount || 15;
                let extraRows = sheet.extraRows || 0;
                html += `
                <div class="flex gap-4 mb-4">
                    <div class="w-1/2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Linhas Extras Vazias (Frente)</label>
                        <input type="number" id="editExtraRows" min="0" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none" value="${extraRows}">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Quantidade de Linhas (Verso)</label>
                        <input type="number" id="editBackRowsCount" min="1" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none" value="${currentBackRows}">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Lista de Pragas</label>
                    <p class="text-xs text-gray-500 mb-2">Digite uma praga por linha.</p>
                    <textarea id="editPragas" class="w-full border border-gray-300 rounded p-2 text-sm h-48 focus:ring-blue-500 focus:border-blue-500 outline-none whitespace-pre-wrap">${sheet.items.join('\n')}</textarea>
                </div>`;
            } else if(sheet.type === 'cronograma31') {
                let extraRows = sheet.extraRows || 0;
                html += `
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Linhas Extras Vazias (Final da tabela)</label>
                    <input type="number" id="editExtraRows" min="0" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none" value="${extraRows}">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Equipamentos e Frequência</label>
                    <p class="text-xs text-gray-500 mb-2">Separe o nome da frequência com a barra vertical ( <span class="font-bold text-black">|</span> ). Uma linha por equipamento. Ex: <span class="italic font-mono">MASSEIRA | DIÁRIA</span></p>
                    <textarea id="editEquipamentos" class="w-full border border-gray-300 rounded p-2 text-sm h-48 focus:ring-blue-500 focus:border-blue-500 outline-none placeholder-gray-400 whitespace-pre-wrap">${sheet.items.map(i => i.name + ' | ' + i.freq).join('\n')}</textarea>
                </div>`;
            } else if(sheet.type === 'temperatura2') {
                 let currentRows = sheet.rowsCount || 25;
                 html += `
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Quantidade de Linhas (Tabela)</label>
                    <input type="number" id="editRowsCount" min="1" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none" value="${currentRows}">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nome do Equipamento 1 (Esquerda)</label>
                    <input type="text" id="editEq1" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none" value="${sheet.eq1}">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nome do Equipamento 2 (Direita)</label>
                    <input type="text" id="editEq2" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none" value="${sheet.eq2}">
                </div>`;
            } else if (sheet.type === 'listaVazia') {
                 let currentRows = sheet.rowsCount || 20;
                 html += `
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Quantidade de Linhas (Tabela)</label>
                    <input type="number" id="editRowsCount" min="1" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-blue-500 focus:border-blue-500 outline-none" value="${currentRows}">
                </div>`;
            }
            
            document.getElementById('editFormContent').innerHTML = html;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveSheetEdit() {
            const id = document.getElementById('editSheetId').value;
            const sheet = sheetsConfig.find(s => s.id === id);
            if(!sheet) return;

            // Update Basic Info
            sheet.popTitle = document.getElementById('editPopTitle').value;
            sheet.sector = document.getElementById('editSector').value;
            sheet.popNumber = sheet.popTitle.split(' -')[0].trim() || 'POP X';

            // Update Specific Fields
            if(sheet.type === 'pragas31') {
                sheet.backRowsCount = parseInt(document.getElementById('editBackRowsCount').value) || 15;
                sheet.extraRows = parseInt(document.getElementById('editExtraRows').value) || 0;
                sheet.items = document.getElementById('editPragas').value
                                    .split('\n')
                                    .map(i => i.trim())
                                    .filter(i => i !== '');
            } else if(sheet.type === 'cronograma31') {
                sheet.extraRows = parseInt(document.getElementById('editExtraRows').value) || 0;
                sheet.items = document.getElementById('editEquipamentos').value
                                    .split('\n')
                                    .map(line => {
                                        const parts = line.split('|').map(p => p.trim());
                                        if (parts[0]) {
                                            return { name: parts[0], freq: parts[1] || 'DIÁRIA' };
                                        }
                                        return null;
                                    })
                                    .filter(i => i !== null);
            } else if(sheet.type === 'temperatura2') {
                sheet.rowsCount = parseInt(document.getElementById('editRowsCount').value) || 25;
                sheet.eq1 = document.getElementById('editEq1').value;
                sheet.eq2 = document.getElementById('editEq2').value;
            } else if (sheet.type === 'listaVazia') {
                sheet.rowsCount = parseInt(document.getElementById('editRowsCount').value) || 20;
            }

            closeEditModal();
            renderAllSheets();
        }

        // Inicia o sistema ao carregar a tela
        document.addEventListener('DOMContentLoaded', () => {
            // Popula o Dropdown de Setores no painel de Adicionar Nova Planilha
            const newSectorSelect = document.getElementById('newSheetSector');
            SYSTEM_SECTORS.forEach(sec => {
                const opt = document.createElement('option');
                opt.value = sec;
                opt.textContent = sec;
                newSectorSelect.appendChild(opt);
            });

            // Inicializa as abas e renderiza as planilhas do momento (Todos)
            renderSectorTabs();
            renderAllSheets();
            
            // Recalcula datas e recria colunas do mês instantaneamente ao trocar o mês/ano
            document.getElementById('monthSelect').addEventListener('change', renderAllSheets);
            document.getElementById('yearInput').addEventListener('change', renderAllSheets);
            document.getElementById('yearInput').addEventListener('input', renderAllSheets);
        });

    </script>
</body>
</html>
